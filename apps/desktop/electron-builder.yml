appId: com.erniu.nudge
productName: 久坐提醒
directories:
  output: release
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
asar: true
win:
  target:
    - nsis
    - portable
  icon: resources/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 久坐提醒
portable:
  artifactName: 久坐提醒-便携版-${version}.exe
